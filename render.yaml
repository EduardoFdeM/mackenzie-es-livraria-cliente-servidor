services:
  # 1. Serviço de Backend (API REST Flask)
  - type: web
    name: livraria-mackenzie-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Serviço de Frontend (SPA Estática Desacoplada)
  - type: static
    name: livraria-mackenzie-frontend
    staticPublishPath: frontend
    buildCommand: ""
    pullRequestPreviewsEnabled: false
